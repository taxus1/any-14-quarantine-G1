spring:
  # 本机无 MySQL 时的集成测试 profile：H2 开 MySQL 兼容模式
  datasource:
    url: jdbc:h2:mem:quarantine;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver

    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  # 业务两模块不用缓存；Redis 连不上只在首次调用缓存接口时报错，不影响应用启动
  data:
    redis:
      host: localhost
      port: 16379

logging:
  level:
    com.somepro: warn
